[package]
name = "pagurus"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Verified static ownership diagnostics for a small C subset"
readme = "../README.md"
repository = "https://github.com/DavidLee18/pagurus"
keywords = ["c", "ownership", "borrow-checker", "static-analysis", "idris"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
lang-c = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
